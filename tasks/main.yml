# Set up the basic requirements and settings of all Ubuntu servers

- name: Prep prereqs
  ansible.builtin.import_tasks: prereqs.yml

- name: Make SystemD more tolerable
  ansible.builtin.import_tasks: systemd.yml

- name: Configure zsh
  ansible.builtin.import_tasks: zsh.yml

- name: Install and configure NTP
  ansible.builtin.import_tasks: ntp.yml

- name: Install and configure thefuck
  ansible.builtin.import_tasks: thefuck.yml
