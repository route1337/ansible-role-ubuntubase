# Manage NTP configuration
#

- name: Remove legacy NTP packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: absent
    purge: true
    autoremove: true
  vars:
    packages:
      - ntp
      - ntpsec
      - ntpdate

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set localtime symlink to correct TZ
  ansible.builtin.set_fact:
    tzsymlink: "{{ ubuntu_base.tzsymlink }}"

- name: Set the correct time zone for localtime
  ansible.builtin.file:
    path: /etc/localtime
    state: link
    src: "{{ ubuntu_base.localtime }}"
    force: true

- name: Verify chrony is enabled and running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
