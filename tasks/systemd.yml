# Manage SystemD's nonsense and bad design

- name: Stop SystemD's resolved listening from listening on port 53
  ansible.builtin.lineinfile:
    path: '/etc/systemd/resolved.conf'
    line: 'DNSStubListener=no'
    state: present
    regexp: '^DNSStubListener='
  when: ubuntu_base.dns_servers is defined

- name: Disable SystemD's resolved process for good measure
  ansible.builtin.service:
    name: systemd-resolved
    state: stopped
    enabled: false
  when: ubuntu_base.dns_servers is defined

- name: Configure resolv.conf with real DNS servers
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    follow: false
  when: ubuntu_base.dns_servers is defined

- name: Stop SystemD's ntp alternative
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  when: "'systemd-timesyncd.service' in ansible_facts.services"

- name: Purge timesyncd for good measure
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: absent
    purge: true
